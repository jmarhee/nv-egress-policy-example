# Deny egress to an external IPv4 range. Other external destinations stay allowed.
#
# Address criteria accept a CIDR (10.1.0.0/24) or a hyphenated range
# (10.1.0.1-10.1.0.25). 1.1.1.0/24 is Cloudflare's public DNS range; 1.1.1.1
# answers HTTPS, so a client can show the deny against a live address.
# Replace the CIDR before reuse. Do not point it at cluster, node, or service CIDRs.
# On NeuVector 5.6, priority is an integer 0-100 and a higher value is evaluated
# first. The deny is 100 so it matches before the reserved external allow.
apiVersion: neuvector.com/v1
kind: NvSecurityRule
metadata:
  name: nv.deny-ip-range.nv-egress-deny
  namespace: nv-egress-deny
  labels:
    solera.io/cluster: local
    solera.io/policy-domain: network
    solera.io/managed-by: git
spec:
  target:
    policymode: Protect
    selector:
      name: nv.deny-ip-range.nv-egress-deny
      comment: clients whose egress to 1.1.1.0/24 is blocked
      criteria:
        - key: service
          op: "="
          value: deny-ip-range.nv-egress-deny
        - key: domain
          op: "="
          value: nv-egress-deny
  process_profile:
    baseline: basic
    mode: Monitor
  ingress: []
  process: []
  file: []
  egress:
    - action: deny
      name: deny-cloudflare-dns-cidr
      priority: 100
      ports: any
      selector:
        name: ext-1-1-1-0-24
        comment: Cloudflare public DNS 1.1.1.0/24
        criteria:
          - key: address
            op: "="
            value: 1.1.1.0/24
    - action: allow
      name: deny-range-allow-external
      priority: 50
      ports: any
      selector:
        name: external
    - action: allow
      name: deny-range-allow-dns
      priority: 40
      ports: udp/53,tcp/53
      selector:
        name: containers
        criteria:
          - key: container
            op: "="
            value: "*"
